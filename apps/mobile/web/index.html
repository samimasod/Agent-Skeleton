<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!--
      CSP: unsafe-eval is required by Metro's dev bundle (source maps + hot reload)
      and by react-native-reanimated's worklet runtime.
      Remove unsafe-eval and tighten this policy before deploying to production.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss: http: https:; font-src 'self' data:;"
    />

    <title>Mobile App</title>
    <link rel="icon" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
