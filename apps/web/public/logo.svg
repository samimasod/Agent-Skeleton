<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>

    <linearGradient id="cyanIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#006ddd" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="brightCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7fc8ff" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  <polygon points="256,64 416,160 416,352 256,448 96,352 96,160" fill="none" stroke="url(#cyanIndigo)" stroke-width="4" opacity="0.25" />

  <path d="M 352 144 
           L 192 144 
           C 160 144 144 168 144 196 
           C 144 232 176 248 224 260 
           L 288 276 
           C 336 288 368 304 368 340 
           C 368 368 352 392 320 392 
           L 160 392" 
        fill="none" 
        stroke="url(#cyanIndigo)" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <path d="M 336 144 
           L 208 144 
           C 184 144 168 160 168 184 
           C 168 216 192 232 232 244 
           L 280 256 
           C 320 268 344 284 344 316 
           C 344 340 328 356 304 356 
           L 176 356" 
        fill="none" 
        stroke="url(#brightCyan)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#subtleGlow)" />

  <circle cx="352" cy="144" r="10" fill="#00f2fe" filter="url(#subtleGlow)" />
  <circle cx="160" cy="392" r="10" fill="#6366f1" filter="url(#subtleGlow)" />
  <circle cx="256" cy="268" r="8" fill="#7fc8ff" />
  <circle cx="192" cy="196" r="6" fill="#00f2fe" />
  <circle cx="320" cy="340" r="6" fill="#7fc8ff" />

  <line x1="168" y1="184" x2="136" y2="184" stroke="#00f2fe" stroke-width="4" opacity="0.7" />
  <circle cx="136" cy="184" r="4" fill="#00f2fe" />

  <line x1="344" y1="316" x2="376" y2="316" stroke="#6366f1" stroke-width="4" opacity="0.7" />
  <circle cx="376" cy="316" r="4" fill="#6366f1" />
</svg>
